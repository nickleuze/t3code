name: Fork sync

# Once a day, moves nick/patches onto upstream's newest nightly (or stable)
# release. The push uses a deploy key, so it starts Fork release (pushes made
# with GITHUB_TOKEN start nothing, and it cannot push upstream's workflow
# changes).
#
# Runs on Nick's Mac mini (self-hosted runner t3-fork-mac). When the patches
# conflict, OpenCode resolves the rebase with the OpenCode Go key from the
# Mini's 1Password AGENTS vault (op:// reference in the FORK_SYNC_OPENCODE_KEY_REF
# variable). The model is DeepSeek V4 Pro unless FORK_SYNC_MODEL says otherwise.
# The result is pushed only when the rebase finished with every patch, no
# conflict markers remain and the repo typechecks. Otherwise nothing is published: the run fails once and leaves a
# nick/sync-conflict/<tag> branch, which keeps later runs quiet until the
# patches are rebased by hand.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nickleuze/t3code'
    name: Rebase onto upstream
    runs-on: [self-hosted, macOS, ARM64, t3-fork-mac]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: nick/patches
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}

      - name: Rebase
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The runner keeps .git between runs; drop a rebase a failed run left behind.
          git rebase --quit 2>/dev/null || true

          read -r latest latest_commit < <(.github/scripts/fork-upstream-tags.sh)
          marker="nick/sync-conflict/${latest}"
          if git merge-base --is-ancestor "$latest_commit" HEAD 2>/dev/null; then
            echo "nick/patches already includes upstream ${latest}."
            for stale in $(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/nick/sync-conflict/'); do
              git push origin --delete "$stale"
            done
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$marker" >/dev/null; then
            echo "The conflict with ${latest} is already reported; rebase nick/patches by hand."
            exit 0
          fi

          git fetch --no-tags https://github.com/pingdotgg/t3code.git "+refs/tags/${latest}:refs/tags/${latest}"
          base_commit="$(git merge-base HEAD "$latest_commit")"
          {
            echo "latest=${latest}"
            echo "latest_commit=${latest_commit}"
            echo "marker=${marker}"
            echo "head=$(git rev-parse HEAD)"
            echo "patches=$(git rev-list --count "${base_commit}..HEAD")"
          } >> "$GITHUB_OUTPUT"
          echo "Rebasing $(git rev-list --count "${base_commit}..HEAD") patches onto ${latest}."
          if git rebase --onto "$latest_commit" "$base_commit"; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        if: steps.rebase.outputs.result == 'conflict'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Resolve conflicts with OpenCode
        id: resolve
        if: steps.rebase.outputs.result == 'conflict'
        continue-on-error: true
        env:
          KEY_REF: ${{ vars.FORK_SYNC_OPENCODE_KEY_REF }}
          MODEL: ${{ vars.FORK_SYNC_MODEL || 'opencode-go/deepseek-v4-pro' }}
          GIT_EDITOR: "true"
          # Anything left at "ask" would stall a run nobody is watching.
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": { "opencode-go": { "options": { "apiKey": "{env:OPENCODE_GO_API_KEY}" } } },
              "permission": {
                "edit": "allow",
                "bash": {
                  "*": "deny",
                  "git status": "allow", "git status *": "allow",
                  "git diff": "allow", "git diff *": "allow",
                  "git log": "allow", "git log *": "allow",
                  "git show": "allow", "git show *": "allow",
                  "git ls-files": "allow", "git ls-files *": "allow",
                  "git rev-parse *": "allow"
                },
                "webfetch": "deny", "websearch": "deny", "external_directory": "deny",
                "question": "deny", "doom_loop": "deny", "skill": "deny", "task": "deny"
              }
            }
          PROMPT: |
            You are in a checkout of nickleuze/t3code, a personal fork of T3 Code. A rebase of the fork's patches onto upstream ${{ steps.rebase.outputs.latest }} stopped on a conflict while applying one patch.

            Resolve the conflicted files (git status lists them). For each conflict, keep upstream's change and the patch's intent: read the patch being applied (git show REBASE_HEAD) and the upstream commits that touched the same lines, then combine them. Also update any new upstream code the patch would have had to change. Change nothing the conflict does not require. Do not stage, commit or run git rebase; the workflow does that. End with a short summary of each conflict and how you resolved it.
        # The workflow stages the files that were in conflict and advances the
        # rebase, calling OpenCode once per patch that stops.
        run: |
          test -n "$KEY_REF" || { echo "The FORK_SYNC_OPENCODE_KEY_REF variable is not set."; exit 1; }
          # An empty data dir, so OpenCode can't fall back to a key saved in its auth.json.
          # --standalone: OpenCode 2's shared background service ignores this env and the injected key.
          export XDG_DATA_HOME="$RUNNER_TEMP/opencode-data"
          for attempt in 1 2 3 4 5 6 7 8; do
            conflicted="$(git diff --name-only --diff-filter=U)"
            rm -rf "$XDG_DATA_HOME" && mkdir -p "$XDG_DATA_HOME"
            "$HOME/.local/bin/scoped-secrets" run --timeout 1800 -e "OPENCODE_GO_API_KEY=$KEY_REF" -- \
              /opt/homebrew/bin/opencode run --standalone -m "$MODEL" "$PROMPT" </dev/null
            while IFS= read -r file; do
              if [ -f "$file" ] && grep -qE '^(<<<<<<<|>>>>>>>)( |$)' "$file"; then
                echo "Conflict markers remain in $file."; exit 1
              fi
              git add -A -- "$file"
            done <<<"$conflicted"
            test -z "$(git diff --name-only --diff-filter=U)"
            if git rebase --continue; then exit 0; fi
            test -n "$(git diff --name-only --diff-filter=U)"
          done
          exit 1

      - name: Check the rebase
        id: check
        if: steps.rebase.outputs.result == 'conflict' && steps.resolve.outcome == 'success'
        continue-on-error: true
        env:
          LATEST_COMMIT: ${{ steps.rebase.outputs.latest_commit }}
          PATCHES: ${{ steps.rebase.outputs.patches }}
        run: |
          test ! -d "$(git rev-parse --git-path rebase-merge)"
          test ! -d "$(git rev-parse --git-path rebase-apply)"
          test -z "$(git status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor "$LATEST_COMMIT" HEAD
          test "$(git rev-list --count "${LATEST_COMMIT}..HEAD")" = "$PATCHES"
          if git diff "${LATEST_COMMIT}..HEAD" | grep -qE '^\+(<<<<<<<|>>>>>>>)( |$)'; then
            echo "Conflict markers remain."; exit 1
          fi
          git log --stat "${LATEST_COMMIT}..HEAD"
          vp install
          vp run typecheck
          # Unit tests in and beside the files the patches change (browser tests need a browser).
          shopt -s nullglob
          tests=()
          for file in $(git diff --name-only "${LATEST_COMMIT}..HEAD" -- '*.ts' '*.tsx'); do
            stem="${file%.*}"; stem="${stem%.test}"
            for test_file in "$stem".test.ts "$stem".test.tsx "$stem".*.test.ts "$stem".*.test.tsx; do
              [[ "$test_file" == *.browser.test.* ]] || tests+=("$test_file")
            done
          done
          if (( ${#tests[@]} )); then vp test run $(printf '%s\n' "${tests[@]}" | sort -u); fi

      - name: Push
        if: steps.rebase.outputs.result == 'clean' || steps.check.outcome == 'success'
        env:
          HEAD_BEFORE: ${{ steps.rebase.outputs.head }}
        run: git push --force-with-lease="nick/patches:${HEAD_BEFORE}" origin HEAD:nick/patches

      - name: Report the conflict
        if: steps.rebase.outputs.result == 'conflict' && steps.check.outcome != 'success'
        env:
          LATEST: ${{ steps.rebase.outputs.latest }}
          LATEST_COMMIT: ${{ steps.rebase.outputs.latest_commit }}
          MARKER: ${{ steps.rebase.outputs.marker }}
        run: |
          git push origin "${LATEST_COMMIT}:refs/heads/${MARKER}"
          echo "::error::nick/patches does not rebase onto ${LATEST}, and the conflict was not resolved automatically. Nothing was published."
          exit 1

      # The Mini's disk is shared with Nick's own work; don't keep a built checkout between runs.
      - name: Clean the checkout
        if: always()
        run: git clean -ffdxq
