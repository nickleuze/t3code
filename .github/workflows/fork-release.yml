name: Fork release

# Builds the macOS arm64 desktop app from every push to the fork's nick/v2
# and publishes it as a GitHub release. Installed builds update through the
# app's built-in updater: every build is signed with the fork's one
# self-signed certificate, so Squirrel.Mac accepts each new build as the same
# app. fork/update.sh installs a release by hand (first install, recovery).

on:
  push:
    branches: [nick/v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'nickleuze/t3code' && github.ref == 'refs/heads/nick/v2'
    uses: ./.github/workflows/fork-ci.yml
    permissions:
      contents: read
      pull-requests: read

  # Checks and release share this run's github.sha, so a release can only
  # publish the exact commit that passed.
  release:
    needs: checks
    if: github.repository == 'nickleuze/t3code' && github.ref == 'refs/heads/nick/v2' && needs.checks.result == 'success'
    name: Build and publish macOS arm64
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Require the checked commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Each push gets a version above the last, so installed apps can tell
      # they are behind.
      - name: Resolve version
        id: version
        run: |
          base="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${base}-nick.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # As upstream's release does, so the server and web client report this
      # build too and a machine on an older build is offered its update.
      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      # The update feed is this repository's latest GitHub release.
      # T3 Connect sign-in and relay settings are baked into the build (locally
      # they come from .env). They are the same public values upstream ships;
      # without them the app cannot connect to other machines.
      - name: Build
        env:
          T3CODE_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          for name in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL; do
            if [ -z "${!name}" ]; then
              echo "Repository variable $name is not set; the build could not use T3 Connect." >&2
              exit 1
            fi
          done
          PATH="$PWD/node_modules/.bin:$PATH" \
            node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64
          feed="$(unzip -p "release/T3-Code-${T3CODE_DESKTOP_VERSION}-arm64.zip" "T3 Code (Alpha).app/Contents/Resources/app-update.yml")"
          if ! grep -qx "owner: ${GITHUB_REPOSITORY%/*}" <<<"$feed" || ! grep -qx "repo: ${GITHUB_REPOSITORY#*/}" <<<"$feed"; then
            echo "Build does not update from ${GITHUB_REPOSITORY}:" >&2
            echo "$feed" >&2
            exit 1
          fi

      # Re-signs the ad-hoc build with the fork's certificate so every build
      # keeps one identity: Squirrel.Mac only installs an update whose
      # signature satisfies the running app's designated requirement, and the
      # Keychain does not ask again after updates.
      - name: Sign with the fork certificate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORK_MAC_SIGNING_P12: ${{ secrets.FORK_MAC_SIGNING_P12 }}
          FORK_SIGNING_P12_PASSWORD: ${{ secrets.FORK_MAC_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$FORK_MAC_SIGNING_P12" ] || [ -z "$FORK_SIGNING_P12_PASSWORD" ]; then
            echo "Secrets FORK_MAC_SIGNING_P12 and FORK_MAC_SIGNING_P12_PASSWORD must be set." >&2
            exit 1
          fi
          p12="$RUNNER_TEMP/fork-signing.p12"
          printf '%s' "$FORK_MAC_SIGNING_P12" | base64 --decode > "$p12"
          FORK_SIGNING_P12="$p12" fork/sign-release.sh "release/T3-Code-${VERSION}-arm64.zip"
          rm -f "$p12"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="T3-Code-${VERSION}-arm64.zip"
          test -f "release/${zip}"
          # Builds before the built-in updater (up to 0.0.45-nick.9) install
          # through their update button, which runs this asset.
          cp fork/update.sh release/fork-update.sh
          cd release
          shasum -a 256 "${zip}" > SHA256SUMS
          sha="$(cut -d' ' -f1 SHA256SUMS)"
          # Signing changed the zip, so the updater manifest electron-builder
          # wrote is replaced with one for the signed zip only.
          sha512="$(openssl dgst -sha512 -binary "${zip}" | base64)"
          cat > latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${zip}
              sha512: ${sha512}
              size: $(stat -f%z "${zip}")
          path: ${zip}
          sha512: ${sha512}
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          EOF
          printf '{"version":"%s","commit":"%s","zip":"%s","sha256":"%s","builtAt":"%s"}\n' \
            "${VERSION}" "${GITHUB_SHA}" "${zip}" "${sha}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > fork-release.json
          notes="Built from ${GITHUB_SHA} on nick/v2.

          Installed fork builds update from the app; fork/update.sh installs it by hand."
          gh release create "fork-v${VERSION}" "${zip}" latest-mac.yml SHA256SUMS fork-release.json fork-update.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Fork ${VERSION}" \
            --notes "${notes}" \
            --latest
